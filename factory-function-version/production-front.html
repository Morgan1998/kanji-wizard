<div class="front-card-container">
    <div class="kanji-box">
        <svg viewBox="0 0 109 109" width="140" height="140">
            <path id="kanji-stroke-path" d="" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </div>
</div>

<script>
(() => {
    const createStrokeState = (maxStrokes) => {
        let currentStroke = 0;

        const increment = () => {
            if (currentStroke >= maxStrokes) {
                currentStroke = 0;
            } else currentStroke++;
        };

        const getCurrent = () => currentStroke;

        return { increment, getCurrent };
    };

    const createKanjiCanvas = (pathId) => {
        const pathElement = document.getElementById(pathId);

        const updateCanvas = (strokeDataArray, currentCount) => {
            if (!pathElement) return;

            const cumulativePathString = strokeDataArray
                .slice(0, currentCount)
                .join(' ');

            pathElement.setAttribute('d', cumulativePathString);
        };

        return { updateCanvas };
    };

    const initFrontCardApp = () => {
        const strokeData = [
            "M20,40 L80,40",  
            "M15,70 L85,70"   
        ];

        // Instantiate modules using our updated naming conventions
        const strokeStateManager = createStrokeState(strokeData.length);
        const kanjiCanvasManager = createKanjiCanvas('kanji-stroke-path');
        const tappableArea = document.querySelector('.front-card-container');

        if (!tappableArea) return;

        const handleTap = () => {
            strokeStateManager.increment();
            const currentCount = strokeStateManager.getCurrent();
            kanjiCanvasManager.updateCanvas(strokeData, currentCount);
        };

        tappableArea.addEventListener('click', handleTap);
    };

    initFrontCardApp();

})();
</script>
