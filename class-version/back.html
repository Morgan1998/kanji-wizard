<script>
(() => {

    const SVG_NAMESPACE = "http://www.w3.org/2000/svg";

    const DOM_PARSER = new DOMParser();

    class SigilController {
        sigil = null;
        isDragging = null;
        constructor(sigilElement, sigilType) {
            this.sigil = document.querySelector(sigilElement);
            this.sigilType = sigilType;
            this.isDragging = false;

            this.startXCoordinate = 0;
            this.startYCoordinate = 0;
            this.hasMoved = false;

            this.currentIndex = 0;
            this.init();
        }

        updateSigilColor() {
            const activeEntry = this.getActiveVocabEntry();
            if (!activeEntry) return;

            const style = getComputedStyle(activeEntry);
            const color = style.getPropertyValue('--accent-color');

            this.sigil.style.setProperty('--accent-color', color);
        }

        getActiveVocabEntry() {
            return document.querySelector('.vocab-entry.active-reveal');
        }


        revealNextVocabSegment() {
            const entries = document.querySelectorAll('.vocab-entry');
            if (this.currentIndex >= entries.length) {
                entries[this.currentIndex - 1].classList.remove('active-reveal');
                return;
            }

            if (this.currentIndex > 0) {
                entries[this.currentIndex - 1].classList.remove('active-reveal');
            }
            
            const currentEntry = entries[this.currentIndex];

            const allFurigana = currentEntry.querySelectorAll('.furigana');

            const hiddenFurigana = Array.from(allFurigana).find(furigana => furigana.classList.contains('is-hidden'));

            if (hiddenFurigana) {
                hiddenFurigana.classList.remove('is-hidden');
                currentEntry.classList.add('active-reveal');
            } else {
                const english = currentEntry.querySelector('.vocab-english');
                if (english && english.classList.contains('is-hidden')) {
                    english.classList.remove('is-hidden');
                    this.currentIndex++;
                }
            }
        }

        dockSigil() {
            const dock = document.querySelector('#sigil-dock');
            const workspace = document.querySelector('.deck-workspace');
            const dockRect = dock.getBoundingClientRect();
            const workspaceRect = workspace.getBoundingClientRect();
            const targetX = dockRect.left - workspaceRect.left + (dockRect.width / 2) - (this.sigil.offsetWidth / 2);
            const targetY = dockRect.top - workspaceRect.top + (dockRect.height / 2) - (this.sigil.offsetHeight / 2);

            this.sigil.style.left = `${targetX}px`;
            this.sigil.style.top = `${targetY}px`;

            setTimeout(() => {
                this.sigil.classList.add('hidden-in-dock');
            }, 10);

            localStorage.setItem(`${this.sigilType}-sigil-docked`, 'true');
        }

        undockSigil() {
            const workspace = document.querySelector('.deck-workspace');
            const dock = document.querySelector('#sigil-dock');
            const dockRect = dock.getBoundingClientRect();
            const workspaceRect = workspace.getBoundingClientRect();

            this.sigil.classList.add('is-animating'); 
            workspace.appendChild(this.sigil);

            const startX = dockRect.left - workspaceRect.left;
            const startY = dockRect.top - workspaceRect.top;
            
            this.sigil.style.left = `${startX}px`;
            this.sigil.style.top = `${startY}px`;

            this.sigil.offsetHeight; 

            this.sigil.classList.remove('hidden-in-dock');
            this.sigil.style.top = `${startY - 80}px`; 

            localStorage.setItem(`${this.sigilType}-sigil-docked`, 'false');

            setTimeout(() => this.sigil.classList.remove('is-animating'), 400);
        }

        loadPosition() {
            const xCoordinate = localStorage.getItem(`${this.sigilType}-sigil-x-coordinate`);
            const yCoordinate = localStorage.getItem(`${this.sigilType}-sigil-y-coordinate`);
            if (xCoordinate && yCoordinate) {
                this.sigil.style.left = xCoordinate;
                this.sigil.style.top = yCoordinate;
                this.sigil.style.bottom = 'auto';
                this.sigil.style.right = 'auto';
            }
        }

        setupListeners() {
            const workspace = document.querySelector('.deck-workspace');
            const sigilDock = document.querySelector('#sigil-dock');

            sigilDock.addEventListener('click', (event) => {
                event.stopPropagation();
                
                if (this.sigil.classList.contains('hidden-in-dock')) {
                    this.undockSigil(); // Spit it out
                } else {
                    this.dockSigil();
                }
            });

            this.sigil.addEventListener('pointerdown', (event) => {
                this.sigil.classList.remove('is-animating');
                this.isDragging = true;
                this.hasMoved = false;
                this.startXCoordinate = event.clientX;
                this.startYCoordinate = event.clientY;

                const sigilRectangle = this.sigil.getBoundingClientRect();
                const workspaceRectangle = workspace.getBoundingClientRect();

                this.grabOffsetX = event.clientX - sigilRectangle.left;
                this.grabOffsetY = event.clientY - sigilRectangle.top;

                this.sigil.setPointerCapture(event.pointerId);

                const onPointerMove = (moveEvent) => {
                    if (!this.isDragging) return;

                    if (Math.abs(moveEvent.clientX - this.startXCoordinate) > 5 || Math.abs(moveEvent.clientY - this.startYCoordinate) > 5) {
                        this.hasMoved = true;
                    }

                    requestAnimationFrame(() => {
                        const currentWorkspaceRectangle = workspace.getBoundingClientRect();

                        let newX = moveEvent.clientX - currentWorkspaceRectangle.left - this.grabOffsetX;
                        let newY = moveEvent.clientY - currentWorkspaceRectangle.top - this.grabOffsetY;

                        const maximumX = currentWorkspaceRectangle.width - this.sigil.offsetWidth;
                        const maximumY = currentWorkspaceRectangle.height - this.sigil.offsetHeight;

                        this.sigil.style.left = Math.max(0, Math.min(newX, maximumX)) + 'px';
                        this.sigil.style.top = Math.max(0, Math.min(newY, maximumY)) + 'px';
                    });
                };

                const onPointerUp = () => {
                    const dock = document.querySelector('#sigil-dock');
                    const sigilRect = this.sigil.getBoundingClientRect();
                    const dockRect = dock.getBoundingClientRect();

                    const isOverDock = !(sigilRect.right < dockRect.left || 
                    sigilRect.left > dockRect.right || 
                    sigilRect.bottom < dockRect.top || 
                    sigilRect.top > dockRect.bottom);

                    if (this.isDragging) {
                        this.isDragging = false;
                        this.sigil.classList.add('is-animating')
                        if (isOverDock) {
                            this.dockSigil();
                        } else {
                            localStorage.setItem(`${this.sigilType}-sigil-x-coordinate`, this.sigil.style.left);
                            localStorage.setItem(`${this.sigilType}-sigil-y-coordinate`, this.sigil.style.top);
                        }
                    }
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);
                };

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            });

            this.sigil.addEventListener('click', (event) => {
                if (this.hasMoved) return;
                if (this.sigilType === 'vocab') {
                    this.revealNextVocabSegment();
                    this.updateSigilColor();
                }
            });
        }

        restoreState() {
            const isDocked = localStorage.getItem(`${this.sigilType}-sigil-docked`) === 'true';
            const dock = document.querySelector('#sigil-dock');

            if (isDocked && dock) {
                this.sigil.classList.add('hidden-in-dock');
                dock.appendChild(this.sigil);
            } else {
                this.loadPosition();
            }
        }

        init() {
            this.sigil.classList.add('is-animating');
            this.restoreState();
            this.setupListeners();
        }
    }

    class LinkInstallationService {
        targetLinkElement = null;

        constructor(config) {
            this.targetLinkElement = document.querySelector(config.linkSelector);

            if (!this.targetLinkElement) {
                return;
            }

            this.installDynamicUrl(config.baseUrl, config.params, config.openInNewTab);
        }

        installDynamicUrl(baseUrlString, parametersObject = {}, openInNewTabFlag = true) {
            const urlParametersBuilder = new URLSearchParams();

            for (const [parameterKey, parameterValue] of Object.entries(parametersObject)) {
                const isSelectorStringFlag = parameterValue.startsWith('#') || parameterValue.startsWith('.');

                const resolvedValueString = isSelectorStringFlag
                    ? document.querySelector(parameterValue)?.textContent?.trim() || 'Unknown'
                    : parameterValue;

                urlParametersBuilder.append(parameterKey, resolvedValueString);
            }

            const hasParametersFlag = Object.keys(parametersObject).length > 0;
            const finalizedUrlString = hasParametersFlag
                ? `${baseUrlString}?${urlParametersBuilder.toString()}`
                : baseUrlString;
                
            this.targetLinkElement.href = finalizedUrlString;

            if (openInNewTabFlag) {
                this.targetLinkElement.target = '_blank';
            }
        }
    }
    
    class ReadingDisplayController {
        kunyomiButtonElement = null;
        onyomiButtonElement = null;
        onDisplayElement = null;
        kunDisplayElement = null;
        onDisplayWrapperElement = null;
        kunDisplayWrapperElement = null;
        kunyomiDataString = '';
        onyomiDataString = '';

        constructor(config) {
            this.kunyomiButtonElement = document.querySelector(config.kunyomiButtonSelector);
            this.onyomiButtonElement = document.querySelector(config.onyomiButtonSelector);
            this.onDisplayElement = document.querySelector(config.onDisplaySelector);
            this.kunDisplayElement = document.querySelector(config.kunDisplaySelector);
            this.onDisplayWrapperElement = document.querySelector(config.onDisplayWrapperSelector);
            this.kunDisplayWrapperElement = document.querySelector(config.kunDisplayWrapperSelector);
            this.kunyomiDataString = document.querySelector(config.kunyomiDataSelector)?.textContent?.trim() || 'No Kunyomi';
            this.onyomiDataString = document.querySelector(config.onyomiDataSelector)?.textContent?.trim() || 'No Onyomi';

            if (!this.kunyomiButtonElement || !this.onyomiButtonElement || !this.onDisplayElement || !this.kunDisplayElement || !this.kunDisplayWrapperElement || !this.onDisplayWrapperElement) return;

            this.init();
        }

        init() {
            if(this.kunDisplayElement && this.kunDisplayWrapperElement) {
                this.buildReadingsSpans(this.kunyomiDataString, this.kunDisplayElement);
            }

            if(this.onDisplayElement && this.onDisplayWrapperElement) {
                this.buildReadingsSpans(this.onyomiDataString, this.onDisplayElement);
            }

            this.kunyomiButtonElement.addEventListener('click', (event) => {
                this.handleToggle(event, this.kunyomiButtonElement, this.onyomiButtonElement, this.kunyomiDataString);
            });

            this.onyomiButtonElement.addEventListener('click', (event) => {
                this.handleToggle(event, this.onyomiButtonElement, this.kunyomiButtonElement, this.onyomiDataString);
            });
        }

        buildReadingsSpans(readingsDataString, displayElement) {
            displayElement.replaceChildren();

            const readingsArray = readingsDataString.split(/[、,]/)
                                                    .map(reading => reading.trim())
                                                    .filter(reading => reading.length > 0);

            readingsArray.forEach(reading => {
                const badge = document.createElement('span');
                badge.classList.add('readings-badge');
                badge.textContent = reading;

                displayElement.append(badge);
            })
        }

        handleToggle(event, clickedButtonElement, otherButtonElement, readingValueString) {
            event.stopPropagation();

            const kanjiHouse = document.querySelector('.kanji-house');
            const isHotSwap = otherButtonElement.classList.contains('active');
            if (isHotSwap) {
                kanjiHouse.classList.add('is-switching');
            } else {
                kanjiHouse.classList.remove('is-switching');
            }

            const vocabLedger = document.querySelector('#vocab-ledger');

            if (clickedButtonElement === this.onyomiButtonElement) {
                if (clickedButtonElement.classList.contains('active')) {
                    clickedButtonElement.classList.remove('active');
                    this.onDisplayWrapperElement.classList.remove('active');
                    vocabLedger.removeAttribute('data-active-filter');
                } else {
                    clickedButtonElement.classList.add('active');
                    otherButtonElement.classList.remove('active');
                    this.onDisplayWrapperElement.classList.add('active');
                    this.kunDisplayWrapperElement.classList.remove('active');
                    
                    const readingType = clickedButtonElement.dataset.type;
                    vocabLedger.setAttribute('data-active-filter', readingType);
                }
            }

            if (clickedButtonElement === this.kunyomiButtonElement) {
                if (clickedButtonElement.classList.contains('active')) {
                    clickedButtonElement.classList.remove('active');
                    this.kunDisplayWrapperElement.classList.remove('active');
                    vocabLedger.removeAttribute('data-active-filter');
                } else {
                    clickedButtonElement.classList.add('active');
                    otherButtonElement.classList.remove('active');
                    this.kunDisplayWrapperElement.classList.add('active');
                    this.onDisplayWrapperElement.classList.remove('active');
                    
                    const readingType = clickedButtonElement.dataset.type;
                    vocabLedger.setAttribute('data-active-filter', readingType);
                }
            }
        }
    }
    
    class VocabLedgerService {
        constructor(config) {
            this.currentKanji = document.querySelector(config.kanjiDataElement)?.textContent?.trim() || '';
            this.ledgerContainer = document.querySelector(config.ledgerContainerElement);
            this.enhancedKunReadings = config.enhancedKunReadings;
            this.enhancedOnReadings = config.enhancedOnReadings;

            const rawVocabJsonString = document.querySelector(config.vocabDataElement)?.textContent?.trim() || '';
            if (!rawVocabJsonString || !this.ledgerContainer) {
                return;
            }

            try {
                const vocabArray = JSON.parse(rawVocabJsonString);
                const cleanedVocabArray = this.convertKebabToCamel(vocabArray);
                this.render(cleanedVocabArray);
            } catch (error) {
                console.error('Failed to parse vocab-json string:', error);
            }
        }


        getReadingType(vocab) {
            const targetSegment = vocab.withRuby.find(kanjiFuriganaOkuriganaSet => {
                return kanjiFuriganaOkuriganaSet.k === this.currentKanji;
            });

            if (!targetSegment) {
                return 'neither';
            }

            const furigana = targetSegment.f || '';
            const okurigana = targetSegment.o || '';

            if (okurigana.length > 0) {
                if ((this.enhancedKunReadings.includes(furigana)) || (this.enhancedKunReadings.includes(`${furigana}${okurigana}`))) return 'kun';
            }

            const kanjiSegments = vocab.withRuby.filter(segment => {
                return /^[\u4e00-\u9faf]+$/.test(segment.k);
            });

            if (kanjiSegments.length > 1) {
                if (this.enhancedOnReadings.includes(furigana)) return 'on';

                return 'kun';
            }

            if (this.enhancedKunReadings.includes(furigana)) return 'kun';

            if (this.enhancedOnReadings.includes(furigana)) return 'on';

            return 'neither';
        }

            const ledgerContainer = this.ledgerContainer;

                const vocabEntryElement = document.createElement('div');
                vocabEntryElement.classList.add('vocab-entry');

                vocabEntryElement.dataset.readingType = readingType;

        convertKebabToCamel(data) {
            if (Array.isArray(data)) {
                return data.map(item => this.convertKebabToCamel(item));
            }
            
            if (data !== null && typeof data === 'object') {
                return Object.fromEntries(
                    Object.entries(data).map(([key, value]) => {
                        const camelKey = key.replace(/-([a-z])/g, (_, letter) => letter.toUpperCase());
                        
                        return [camelKey, this.convertKebabToCamel(value)];
                    })
                );
            }
            
            return data;
        }
    }

    
    
    
    class StrokeStateController {
        currentStroke = 0;
        maxStrokes = 0;

        constructor(maxStrokes) {
            this.maxStrokes = maxStrokes;
            this.currentStroke = maxStrokes;
        }

        increment() {
            if (this.currentStroke >= this.maxStrokes) {
                this.currentStroke = 0;
            } else {
                this.currentStroke++;
            }
        }

        setToMax() {
            this.currentStroke = this.maxStrokes;
        }

        setToZero() {
            this.currentStroke = 0;
        }

        getCurrent() {
            return this.currentStroke;
        }
    }

    class KanjiSvgController {

        constructor(elementSelector='#svg-stroke-group', svgData) {
            this.svgStrokeGroup = document.querySelector(elementSelector);
            this.svgData = svgData;
            this.#initializeCanvas();
            this.cachedPaths = Array.from(this.svgStrokeGroup.querySelectorAll('path'));
            this.#applyComponentColorSequence();
        }

        #initializeCanvas() {
            if (!this.svgStrokeGroup || !this.svgData) {
                console.warn('KanjiSvgController: Target element or SVG data is missing.');
                return;
            }


            this.svgStrokeGroup.replaceChildren();

            const children = Array.isArray(this.svgData.g) ? this.svgData.g : [this.svgData.g];
            children.forEach(groupNode => {
                const DOMGroup = SvgTreeBuilder.buildNode(groupNode, 'g');
                console.log(DOMGroup);
                this.svgStrokeGroup.appendChild(DOMGroup);
            });
        }

                    /**
         * Identifies distinct structural elements in the SVG and applies 
         * looping color classes to them (excluding the radical).
         */
        #applyComponentColorSequence() {
            // 1. Get the container
            if (!this.svgStrokeGroup) return;

            // 2. Find all groups that represent structural elements
            const allComponentGroups = Array.from(this.svgStrokeGroup.querySelectorAll('g[kvg\\:element]'));

            // 3. Filter out the radical group so it stays colored by our static CSS rule
            const normalComponents = allComponentGroups.filter(group => {
                const isRadical = group.getAttribute('kvg:radical') === 'general';
                
                // We also skip the root/outermost Kanji element itself (e.g., id="kvg:096fb" for "電")
                const isRootElement = group.id.endsWith('g') === false && group.id.split('-').length === 1;

                return !isRadical && !isRootElement;
            });

            // 4. Define our color sequence pattern length (3 colors: Blue, Green, Yellow)
            const sequenceLength = 3;

            // 5. Apply the looping classes to the remaining elements
            normalComponents.forEach((group, index) => {
                // This yields classes: 'element-color-1', 'element-color-2', 'element-color-3'
                const colorIndex = (index % sequenceLength) + 1;
                group.classList.add(`element-color-${colorIndex}`);
            });
        }

        /**
         * Draws a specific stroke by setting its dashoffset to 0. 
         * @param {number} currentCount - How many strokes needed to be drawn, which also represents the
         * index of the next stroke to draw (need to translate to 0 index from 1 index)
         */
        drawNextStroke(currentCount) {
            const targetPath = this.cachedPaths[currentCount - 1];

            if (targetPath) {
                targetPath.style.strokeDashoffset = 0;
            }
        }

        /**
         * Resets all cached paths back to their initial hidden states.
         */
        resetAllStrokes() {
            this.cachedPaths.forEach(path => {
                const originalLength = path.dataset.strokeLength;
                if (originalLength) {
                    path.style.strokeDashoffset = originalLength;
                }
            })
        }

            /**
         * Toggles the component coloring on and off.
         */
        toggleColors() {
            if (this.svgStrokeGroup) {
                this.svgStrokeGroup.classList.toggle('show-colors');
            }
        }
    }

    class SvgTreeBuilder {

    /**
     * Recursively builds SVG DOM nodes from a nested JSON tree.
     * @param {Object} node - The current JSON node (g, path, etc.)
     * @param {string} tagName - 'g' or 'path'
     * @returns {SVGElement}
     */
    static buildNode(node, tagName) {
        const element = document.createElementNS(SVG_NAMESPACE, tagName);

        for (const [key, value] of Object.entries(node)) {
            if (key === 'g' || key === 'path') {
                // It is a child node. Process recursively.
                const children = Array.isArray(value) ? value : [value];
                children.forEach(child => {
                    const childElement = this.buildNode(child, key);
                    element.appendChild(childElement);
                });
            } else if (key === 'text') {
                // We'll skip stroke number texts for now to keep the focus clean
                continue;
            } else if (typeof value === 'string' || typeof value === 'number') {
                // Copy all attributes (including id, style, kvg properties) directly
                element.setAttribute(key, value);
            }
        }

        // If it's a path, perform initial rendering setup
        if (tagName === 'path') {
            this.setupPathAnimation(element);
        }

        return element;
    }

    /**
     * Calculates path length and sets dash values to hide the path initially.
     * @param {SVGPathElement} pathElement 
     */
    static setupPathAnimation(pathElement) {
        pathElement.classList.add('kanji-stroke');
        
        // We must append temporary styling to measure the length safely
        const length = pathElement.getTotalLength();
        
        // Cache the length on the element's dataset so we don't recalculate it later
        pathElement.dataset.strokeLength = length;
        
        // Set initial dash attributes so it starts invisible
        pathElement.style.strokeDasharray = length;
        pathElement.style.strokeDashoffset = 0;
    }
}

    class DataLoader {
    /**
     * @param {string} 
     */
    constructor(elementId = 'json-container') {
        this.elementId = elementId;
        this.data = this.#init();
    }

    #init() {
        const element = document.getElementById(this.elementId);
        
        if (!element || !element.textContent.trim()) {
            console.error(`Kanji Wizard Error: #${this.elementId} not found or empty.`);
            return null;
        }

        try {
            return JSON.parse(element.textContent);
        } catch (err) {
            console.error("Kanji Wizard Error: Failed to parse JSON data.", err);
            return null;
        }
    }

    isValid() {
        return this.data !== null;
    }
}

        }

        /**
         * @returns {string[]} e.g., []
         */
        getKunReadings() {
            return this.data.kun_readings || [];
        }

        /**
         * @returns {Object|null} The nested SVG structure for drawing
         */
        getSvgData() {
            return this.data.svg || null;
        }

        /**
         * @returns {Object[]} The list of associated vocabulary words
         */
        getAssociatedWords() {
            return this.data.associatedWords || [];
        }
    }

    class BackCardApp {

        strokeStateController = null;
        kanjiSvgController = null;
        tappableArea = null;


        constructor() {

            const loader = new DataLoader();
            if (!loader.isValid()) {
                console.log('JSON container not accessed properly');
                return;
            }
            const dataProvider = new KanjiDataProvider(loader.data);

            this.kanjiSvgController = new KanjiSvgController('#svg-stroke-group', dataProvider.getSvgData());
            this.strokeStateController = new StrokeStateController(this.kanjiSvgController.cachedPaths.length);
            this.kanjiTappableArea = document.querySelector('.kanji-house');
            
            this.init();
        }

        init() {

            new SigilController('#kanji-sigil', 'vocab');

            /* new VocabLedgerService({
                vocabDataElement: '#vocab-data',
                ledgerContainerElement: '#vocab-ledger',
                kanjiDataElement: '#kanji',
                enhancedKunReadings: this.enhancedKunReadings,
                enhancedOnReadings: this.enhancedOnReadings,
            });
            */

            /* new ReadingDisplayController({
                kunyomiButtonSelector: '#kunyomi-button',
                onyomiButtonSelector: '#onyomi-button',
                onDisplaySelector: '#readings-display-on',
                kunDisplaySelector: '#readings-display-kun',
                onDisplayWrapperSelector: '#readings-display-wrapper-on',
                kunDisplayWrapperSelector: '#readings-display-wrapper-kun',
                kunyomiDataSelector: '#kun-data',
                onyomiDataSelector: '#on-data'
            });

            new LinkInstallationService({
                linkSelector: '#report-issue-link',
                baseUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeji75MTbdugBk8IiQYl4_JQyIoiYMMwil0bMiCjl1r1pjZUg/viewform',
                openInNewTab: true,
                params: {
                    'usp': 'pp_url',
                    'entry.196764883': '#kanji',
                    'entry.870807372': '#jlpt-level'
                }
            });
            */
            
            this.setupThemeToggle();

            this.setupListeners();
        } 

        setupListeners() {

            if (!this.kanjiTappableArea) {
                return;
            }
            this.kanjiTappableArea.addEventListener('click', (event) => this.handleKanjiTap(event));

                    const highlightButton = document.querySelector('#highlight-elements-kanji-tool-button');
        
        if (highlightButton) {
            highlightButton.addEventListener('click', (event) => {
                event.stopPropagation(); 
                this.kanjiSvgController.toggleColors();
                highlightButton.classList.toggle('active');
            });
        }
        }

        handleKanjiTap(event) {

            if (event.target.closest('.readings-display-wrapper')) {
                return;
            }

            this.strokeStateController.increment();
            const currentCount = this.strokeStateController.getCurrent();

            if (currentCount === 0) {
                this.kanjiSvgController.resetAllStrokes();
            } else {
                this.kanjiSvgController.drawNextStroke(currentCount);
            }
        }


        setupThemeToggle() {
            this.themeButton = document.querySelector('#toggle-theme-button');
            if (!this.themeButton) return;

            const root = document.documentElement;

            const updateState = (isDark) => {
                // Toggle both explicitly
                root.classList.toggle('user-night-mode', isDark);
                root.classList.toggle('user-day-mode', !isDark);
                
                this.themeButton.setAttribute('data-theme', isDark ? 'dark' : 'light');
                localStorage.setItem('kanji-wizard-theme', isDark ? 'dark' : 'light');
            };

            // Initialize based on locallySavedTheme preference or system default
            const locallySavedTheme = localStorage.getItem('kanji-wizard-theme');
            const userSystemSetAsDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            updateState(locallySavedTheme ? locallySavedTheme === 'dark' : userSystemSetAsDark);

            // Event listener
            this.themeButton.addEventListener('click', (event) => {
                event.stopPropagation();
                // Check current state and flip it
                const switchedToDarkMode = root.classList.contains('user-day-mode');
                updateState(switchedToDarkMode);
            });
        }
    }
    
    new BackCardApp();
    
})();
</script>
