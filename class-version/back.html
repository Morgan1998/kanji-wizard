<script>
(() => {

    const SVG_NAMESPACE = "http://www.w3.org/2000/svg";

    const DOM_PARSER = new DOMParser();

    class LinkInstallationService {
        targetLinkElement = null;

        constructor(config) {
            this.targetLinkElement = document.querySelector(config.linkSelector);

            if (!this.targetLinkElement) {
                return;
            }

            this.installDynamicUrl(config.baseUrl, config.params, config.openInNewTab);
        }

        installDynamicUrl(baseUrlString, parametersObject = {}, openInNewTabFlag = true) {
            const urlParametersBuilder = new URLSearchParams();

            for (const [parameterKey, parameterValue] of Object.entries(parametersObject)) {
                const isSelectorStringFlag = parameterValue.startsWith('#') || parameterValue.startsWith('.');

                const resolvedValueString = isSelectorStringFlag
                    ? document.querySelector(parameterValue)?.textContent?.trim() || 'Unknown'
                    : parameterValue;

                urlParametersBuilder.append(parameterKey, resolvedValueString);
            }

            const hasParametersFlag = Object.keys(parametersObject).length > 0;
            const finalizedUrlString = hasParametersFlag
                ? `${baseUrlString}?${urlParametersBuilder.toString()}`
                : baseUrlString;
                
            this.targetLinkElement.href = finalizedUrlString;

            if (openInNewTabFlag) {
                this.targetLinkElement.target = '_blank';
            }
        }
    }

    class KanjiDataUtil {

        static purifyReadings(selector) {
            const dataElement = document.querySelector(selector);
            if (!dataElement || !dataElement.textContent.trim()) {
                return;
            }

            const readings = dataElement.textContent.split(',').map(reading => {
                let cleaned = reading.trim().replace(/[.\s]/g, '');
                return cleaned.replace(/[\u30a1-\u30f6]/g, match => {
                    return String.fromCharCode(match.charCodeAt(0) - 0x60);
                });
            }).filter(Boolean);

            dataElement.dataset.enhancedReadings = [...new Set(readings)].join(', ');
        }

        static injectGeminationReadings(selector = '#on-data') {
            const dataElement = document.querySelector(selector);
            const sourceReadings = dataElement?.dataset.enhancedReadings || dataElement?.textContent;
            if (!sourceReadings) return;

            const cleanedReadings = sourceReadings.split(',').map(reading => reading.trim()).filter(Boolean);
            const updatedReadings = [...cleanedReadings];

            cleanedReadings.forEach(reading => {
                const lastCharacter = reading.slice(-1);
                if (['つ', 'く'].includes(lastCharacter)) {
                    const stem = reading.slice(0, -1);
                    updatedReadings.push(`${stem}っ`);
                }
            });

            dataElement.dataset.enhancedReadings = [...new Set(updatedReadings)].join(', ');
        }

        static injectRendakuReadings(selector) {
            const dataElement = document.querySelector(selector);
            const sourceReadings = dataElement?.dataset.enhancedReadings || dataElement?.textContent;
            if (!sourceReadings) return;

            const cleanedReadings = sourceReadings.split(',').map(reading => reading.trim()).filter(Boolean);
            const updatedReadings = [...cleanedReadings];

            const rendakuMap = {
                        'か': ['が'], 'き': ['ぎ'], 'く': ['ぐ'], 'け': ['げ'], 'こ': ['ご'],
                        'さ': ['ざ'], 'し': ['じ'], 'す': ['ず'], 'せ': ['ぜ'], 'そ': ['ぞ'],
                        'た': ['だ'], 'ち': ['ぢ'], 'つ': ['づ'], 'て': ['で'], 'と': ['ど'],
                        'は': ['ば', 'ぱ'], 'ひ': ['び', 'ぴ'], 'ふ': ['ぶ', 'ぷ'], 'へ': ['べ', 'ぺ'], 'ほ': ['ぼ', 'ぽ']
                    };

            cleanedReadings.forEach(reading => {
                const firstCharacter = reading.charAt(0);

                if (rendakuMap[firstCharacter]) {
                    const tailOfReading = reading.slice(1);

                    rendakuMap[firstCharacter].forEach(voicedCharacter => {
                        updatedReadings.push(`${voicedCharacter}${tailOfReading}`);
                    });

                }
            });

            dataElement.dataset.enhancedReadings = [...new Set(updatedReadings)].join(', ');
        }
    }
    
    class ReadingDisplayController {
        kunyomiButtonElement = null;
        onyomiButtonElement = null;
        onDisplayElement = null;
        kunDisplayElement = null;
        onDisplayWrapperElement = null;
        kunDisplayWrapperElement = null;
        kunyomiDataString = '';
        onyomiDataString = '';

        constructor(config) {
            this.kunyomiButtonElement = document.querySelector(config.kunyomiButtonSelector);
            this.onyomiButtonElement = document.querySelector(config.onyomiButtonSelector);
            this.onDisplayElement = document.querySelector(config.onDisplaySelector);
            this.kunDisplayElement = document.querySelector(config.kunDisplaySelector);
            this.onDisplayWrapperElement = document.querySelector(config.onDisplayWrapperSelector);
            this.kunDisplayWrapperElement = document.querySelector(config.kunDisplayWrapperSelector);
            this.kunyomiDataString = document.querySelector(config.kunyomiDataSelector)?.textContent?.trim() || 'No Kunyomi';
            this.onyomiDataString = document.querySelector(config.onyomiDataSelector)?.textContent?.trim() || 'No Onyomi';

            if (!this.kunyomiButtonElement || !this.onyomiButtonElement || !this.onDisplayElement || !this.kunDisplayElement || !this.kunDisplayWrapperElement || !this.onDisplayWrapperElement) return;

            this.init();
        }

        init() {
            if(this.kunDisplayElement && this.kunDisplayWrapperElement) {
                this.buildReadingsSpans(this.kunyomiDataString, this.kunDisplayElement);
            }

            if(this.onDisplayElement && this.onDisplayWrapperElement) {
                this.buildReadingsSpans(this.onyomiDataString, this.onDisplayElement);
            }

            this.kunyomiButtonElement.addEventListener('click', (event) => {
                this.handleToggle(event, this.kunyomiButtonElement, this.onyomiButtonElement, this.kunyomiDataString);
            });

            this.onyomiButtonElement.addEventListener('click', (event) => {
                this.handleToggle(event, this.onyomiButtonElement, this.kunyomiButtonElement, this.onyomiDataString);
            });
        }

        buildReadingsSpans(readingsDataString, displayElement) {
            displayElement.replaceChildren();

            const readingsArray = readingsDataString.split(/[、,]/)
                                                    .map(reading => reading.trim())
                                                    .filter(reading => reading.length > 0);

            readingsArray.forEach(reading => {
                const badge = document.createElement('span');
                badge.classList.add('readings-badge');
                badge.textContent = reading;

                displayElement.append(badge);
            })
        }

        handleToggle(event, clickedButtonElement, otherButtonElement, readingValueString) {
            event.stopPropagation();

            const kanjiHouse = document.querySelector('.kanji-house');
            const isHotSwap = otherButtonElement.classList.contains('active');
            if (isHotSwap) {
                kanjiHouse.classList.add('is-switching');
            } else {
                kanjiHouse.classList.remove('is-switching');
            }

            const vocabLedger = document.querySelector('#vocab-ledger');

            if (clickedButtonElement === this.onyomiButtonElement) {
                if (clickedButtonElement.classList.contains('active')) {
                    clickedButtonElement.classList.remove('active');
                    this.onDisplayElement.classList.remove('active');
                    vocabLedger.removeAttribute('data-active-filter');
                } else {
                    clickedButtonElement.classList.add('active');
                    otherButtonElement.classList.remove('active');
                    this.onDisplayElement.classList.add('active');
                    this.kunDisplayElement.classList.remove('active');
                    
                    const readingType = clickedButtonElement.dataset.type;
                    vocabLedger.setAttribute('data-active-filter', readingType);
                }
            }

            if (clickedButtonElement === this.kunyomiButtonElement) {
                if (clickedButtonElement.classList.contains('active')) {
                    clickedButtonElement.classList.remove('active');
                    this.kunDisplayElement.classList.remove('active');
                    vocabLedger.removeAttribute('data-active-filter');
                } else {
                    clickedButtonElement.classList.add('active');
                    otherButtonElement.classList.remove('active');
                    this.kunDisplayElement.classList.add('active');
                    this.onDisplayElement.classList.remove('active');
                    
                    const readingType = clickedButtonElement.dataset.type;
                    vocabLedger.setAttribute('data-active-filter', readingType);
                }
            }
        }
    }
    
    class VocabLedgerService {
        constructor(config) {
            this.currentKanji = document.querySelector(config.kanjiDataElement)?.textContent?.trim() || '';
            this.ledgerContainer = document.querySelector(config.ledgerContainerElement);
            this.enhancedKunReadings = config.enhancedKunReadings;
            this.enhancedOnReadings = config.enhancedOnReadings;

            const rawVocabJsonString = document.querySelector(config.vocabDataElement)?.textContent?.trim() || '';
            if (!rawVocabJsonString || !this.ledgerContainer) {
                return;
            }

            try {
                const vocabArray = JSON.parse(rawVocabJsonString);
                const cleanedVocabArray = this.convertKebabToCamel(vocabArray);
                this.render(cleanedVocabArray);
            } catch (error) {
                console.error('Failed to parse vocab-json string:', error);
            }
        }


        getReadingType(vocab) {
            const targetSegment = vocab.withRuby.find(kanjiFuriganaOkuriganaSet => {
                return kanjiFuriganaOkuriganaSet.k === this.currentKanji;
            });
            if (!targetSegment) return 'neither';

            const furigana = targetSegment.f || '';
            const okurigana = targetSegment.o || '';
            const fullFuriganaOkuriganaReading = `${furigana}${okurigana}` || '';

            if (this.enhancedKunReadings && this.enhancedKunReadings.includes(fullFuriganaOkuriganaReading)) {
                return 'kun';
            }

            if (this.enhancedOnReadings && this.enhancedOnReadings.includes(furigana)) {
                return 'on';
            }


            return 'neither';
        }

        convertKebabToCamel(data) {
            if (Array.isArray(data)) {
                return data.map(item => this.convertKebabToCamel(item));
            }
            
            if (data !== null && typeof data === 'object') {
                return Object.fromEntries(
                    Object.entries(data).map(([key, value]) => {
                        const camelKey = key.replace(/-([a-z])/g, (_, letter) => letter.toUpperCase());
                        
                        return [camelKey, this.convertKebabToCamel(value)];
                    })
                );
            }
            
            return data;
        }
    }

    class StrokeStateController {
        currentStroke = 0;
        maxStrokes = 0;

        constructor(maxStrokes) {
            this.maxStrokes = maxStrokes;
            this.currentStroke = maxStrokes;
        }

        increment() {
            if (this.currentStroke >= this.maxStrokes) {
                this.currentStroke = 0;
            } else {
                this.currentStroke++;
            }
        }

        setToMax() {
            this.currentStroke = this.maxStrokes;
        }

        setToZero() {
            this.currentStroke = 0;
        }

        getCurrent() {
            return this.currentStroke;
        }
    }

    class StrokeDataParser {
        /**
         * 
         * @param {string} rawHtmlString 
         * @returns {string[]} 
         */
        static parse(rawHtmlString) {
            if (!rawHtmlString || rawHtmlString.trim() === '') {
                console.warn('StrokeDataParser: Received an empty stroke-data string.');
                return [];
            }
            
            const virtualDoc = DOM_PARSER.parseFromString(rawHtmlString, 'text/html');

            const pathElements = virtualDoc.querySelectorAll('path');

            const strokeDataArray = [];

            for (let i = 0; i < pathElements.length; i++) {
                const dValue = pathElements[i].getAttribute('d');
                if (dValue) {
                    strokeDataArray.push(dValue);
                }
            }

            return strokeDataArray;
        }
    }

    class KanjiSvgController {
        svgStrokeGroup = null;

        constructor(svgStrokeGroupId) {
   
            this.svgStrokeGroup = document.querySelector(svgStrokeGroupId);
        }

        drawFullKanji(strokeDataArray) {
            if (!this.svgStrokeGroup) {
                return;
            }
            this.svgStrokeGroup.replaceChildren();
            strokeDataArray.forEach(strokeData => {
                this._appendStaticStroke(strokeData);
            });
        }

        clearKanji() {
            if (!this.svgStrokeGroup) {
                return;
            }
            this.svgStrokeGroup.replaceChildren();
        }

        updateSvg(strokeDataArray, currentCount) {
            if (!this.svgStrokeGroup) return;

            if (currentCount === 0) {
                this.svgStrokeGroup.replaceChildren();
                return;
            }

            const newStrokeIndex = currentCount - 1;
            const newStrokeData = strokeDataArray[newStrokeIndex]; 

            if (this.svgStrokeGroup.children.length > newStrokeIndex) {
                this.svgStrokeGroup.replaceChildren();
                for (let i = 0; i < newStrokeIndex; i++) {
                    this._appendStaticStroke(strokeDataArray[i]);
                }
            }

            const lastDrawnStroke = this.svgStrokeGroup.lastElementChild;
            if (lastDrawnStroke) {
                lastDrawnStroke.style.transition = 'none';
            }

            this._appendAnimatedStroke(newStrokeData);
        }

        _appendStaticStroke(strokeData) {
            const staticPathNode = document.createElementNS(SVG_NAMESPACE, 'path');
            staticPathNode.setAttribute('d', strokeData);
            this._applyDefaultStyles(staticPathNode);
            this.svgStrokeGroup.append(staticPathNode);
        }

        _appendAnimatedStroke(strokeData) {
            const animatedPathNode = document.createElementNS(SVG_NAMESPACE, 'path');
            animatedPathNode.setAttribute('d', strokeData);
            this._applyDefaultStyles(animatedPathNode);
            this.svgStrokeGroup.append(animatedPathNode);

            const totalLength = animatedPathNode.getTotalLength();
            animatedPathNode.style.strokeDasharray = totalLength;
            animatedPathNode.style.strokeDashoffset = totalLength;

            requestAnimationFrame(() => {
                animatedPathNode.style.transition = 'stroke-dashoffset 0.4s ease-in-out';
                animatedPathNode.style.strokeDashoffset = '0';
            });
        }


        _applyDefaultStyles(pathNode) {
            pathNode.classList.add('kanji-stroke');
        }
    }

    class BackCardApp {

        strokeDataArray = [];
        strokeStateController = null;
        kanjiSvgController = null;
        tappableArea = null;

        constructor() {

            KanjiDataUtil.purifyReadings('#on-data');
            KanjiDataUtil.purifyReadings('#kun-data');
            KanjiDataUtil.injectGeminationReadings('#on-data');
            KanjiDataUtil.injectRendakuReadings('#on-data');
            KanjiDataUtil.injectRendakuReadings('#kun-data');
            const onElement = document.querySelector('#on-data');
            const kunElement = document.querySelector('#kun-data');
            this.rawOnReadings = onElement?.textContent
                ? onElement.textContent.split(', ')
                : []
            this.rawKunReadings = kunElement?.textContent
                ? kunElement.textContent.split(', ')
                : []
            this.enhancedOnReadings = onElement?.dataset.enhancedReadings
                ? onElement.dataset.enhancedReadings.split(', ')
                : [];
            this.enhancedKunReadings = kunElement?.dataset.enhancedReadings
                ? kunElement.dataset.enhancedReadings.split(', ')
                : [];

            const strokeDataHolder = document.querySelector('#stroke-data');
            const rawStrokeString = strokeDataHolder ? strokeDataHolder.innerHTML : '';
            this.strokeDataArray = StrokeDataParser.parse(rawStrokeString);

            this.strokeStateController = new StrokeStateController(this.strokeDataArray.length);
            this.kanjiSvgController = new KanjiSvgController('#svg-stroke-group');
            this.tappableArea = document.querySelector('.card-container');
            
            this.init();
        }

        init() {

            new VocabLedgerService({
                vocabDataElement: '#vocab-data',
                ledgerContainerElement: '#vocab-ledger',
                kanjiDataElement: '#kanji',
                enhancedKunReadings: this.enhancedKunReadings,
                enhancedOnReadings: this.enhancedOnReadings,
            });

            new ReadingDisplayController({
                kunyomiButtonSelector: '#kunyomi-button',
                onyomiButtonSelector: '#onyomi-button',
                onDisplaySelector: '#readings-display-on',
                kunDisplaySelector: '#readings-display-kun',
                onDisplayWrapperSelector: '#readings-display-wrapper-on',
                kunDisplayWrapperSelector: '#readings-display-wrapper-kun',
                kunyomiDataSelector: '#kun-data',
                onyomiDataSelector: '#on-data'
            });

            new LinkInstallationService({
                linkSelector: '#report-issue-link',
                baseUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeji75MTbdugBk8IiQYl4_JQyIoiYMMwil0bMiCjl1r1pjZUg/viewform',
                openInNewTab: true,
                params: {
                    'usp': 'pp_url',
                    'entry.196764883': '#kanji',
                    'entry.870807372': '#jlpt-level'
                }
            });
            
            const fillKanjiButton = document.querySelector('#tool-fill-kanji');
            if (fillKanjiButton) {
                fillKanjiButton.addEventListener('click', (event) => {
                    event.stopPropagation();

                    if (this.strokeDataArray.length > 0) {
                        this.strokeStateController.setToMax();
                        this.kanjiSvgController.drawFullKanji(this.strokeDataArray);
                    }
                });
            }

            const clearKanjiButton = document.querySelector('#tool-clear-kanji');
            if (clearKanjiButton) {
                clearKanjiButton.addEventListener('click', (event) => {
                    event.stopPropagation();

                    if (this.strokeDataArray.length > 0) {
                        this.strokeStateController.setToZero();
                        this.kanjiSvgController.clearKanji();
                    }
                });
            }


            if (!this.tappableArea) {
                return;
            }
            this.tappableArea.addEventListener('click', (event) => this.handleTap(event));

            if (this.strokeDataArray.length > 0) {
                this.kanjiSvgController.drawFullKanji(this.strokeDataArray);
            }

            const leftToolbar = document.querySelector('#kanji-toolbar-left');
            const rightToolbar = document.querySelector('#kanji-toolbar-right');

            if (leftToolbar && rightToolbar) {
                const resizeObserver = new ResizeObserver(() => {
                    const leftCount = leftToolbar.childElementCount;
                    const rightCount = rightToolbar.childElementCount;

                    if (rightCount > leftCount) {
                        const dimensions = rightToolbar.getBoundingClientRect();
                        leftToolbar.style.width = `${dimensions.width}px`;
                        leftToolbar.style.height = `${dimensions.height}px`;
                    } else if (leftCount > rightCount) {
                        const dimensions = leftToolbar.getBoundingClientRect();
                        rightToolbar.style.width = `${dimensions.width}px`;
                        rightToolbar.style.height = `${dimensions.height}px`;
                    }
                });

                resizeObserver.observe(rightToolbar);
                resizeObserver.observe(leftToolbar);
            }
            
            this.setupThemeToggle();
        }

        handleTap(event) {

            const hitKanjiHouse = event.target.closest('.kanji-house');
            const hitRootBackground = event.target === event.currentTarget;

            if (!hitKanjiHouse && !hitRootBackground) {
                return;
            }
            if (this.strokeDataArray.length === 0) {
                return;
            }

            this.strokeStateController.increment();
            const currentCount = this.strokeStateController.getCurrent();
            this.kanjiSvgController.updateSvg(this.strokeDataArray, currentCount);
        } 

        setupThemeToggle() {
            this.themeButton = document.querySelector('#toggle-theme-button');
            if (!this.themeButton) return;

            const hasSystemNightThemeOn = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
            const hasAnkiNightThemeOn = () => {
                    return document.documentElement.classList.contains('night-mode') ||
                        document.documentElement.getAttribute('data-bs-theme') === 'dark' ||
                        document.body.classList.contains('nightMode') ||
                        document.body.classList.contains('night_mode') ||
                        document.body.classList.contains('card_dark') ||
                        document.documentElement.classList.contains('user-night-mode');
                };

            const savedTheme = localStorage.getItem('kanji-wizard-theme');

            let isDark;
            if (savedTheme !== null) {
                isDark = savedTheme === 'dark';
            } else {
                isDark = hasSystemNightThemeOn() || hasAnkiNightThemeOn();
            }

            if (isDark) {
                document.documentElement.classList.add('user-night-mode');
                document.documentElement.setAttribute('data-bs-theme', 'dark');
                this.themeButton.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.classList.remove('user-night-mode', 'night-mode');
                document.body.classList.remove('nightMode', 'night_mode', 'card_dark');
                document.documentElement.removeAttribute('data-bs-theme');
                this.themeButton.setAttribute('data-theme', 'light');
            }

            this.themeButton.addEventListener('click', (event) => {
                event.stopPropagation();
                const isNightThemeNow = document.documentElement.classList.toggle('user-night-mode');
                if (isNightThemeNow) {
                    document.documentElement.setAttribute('data-bs-theme', 'dark');
                    this.themeButton.setAttribute('data-theme', 'dark');
                    localStorage.setItem('kanji-wizard-theme', 'dark');
                } else {
                    document.documentElement.removeAttribute('data-bs-theme');
                    document.documentElement.classList.remove('night-mode');
                    document.body.classList.remove('nightMode', 'night_mode', 'card_dark');
                    this.themeButton.setAttribute('data-theme', 'light');
                    localStorage.setItem('kanji-wizard-theme', 'light');
                }
            });
        }
    }
    
    new BackCardApp();
    
})();
</script>
