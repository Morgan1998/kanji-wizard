<script>
(() => {

    const SVG_NAMESPACE = "http://www.w3.org/2000/svg";

    
    class ReadingDisplayController {
        kunyomiButtonElement = null;
        onyomiButtonElement = null;
        onDisplayElement = null;
        kunDisplayElement = null;
        onDisplayWrapperElement = null;
        kunDisplayWrapperElement = null;
        kunyomiData = [];
        onyomiData = [];

        constructor(config) {
            this.kunyomiButtonElement = document.querySelector(config.kunyomiButtonSelector);
            this.onyomiButtonElement = document.querySelector(config.onyomiButtonSelector);
            this.onDisplayElement = document.querySelector(config.onDisplaySelector);
            this.kunDisplayElement = document.querySelector(config.kunDisplaySelector);
            this.onDisplayWrapperElement = document.querySelector(config.onDisplayWrapperSelector);
            this.kunDisplayWrapperElement = document.querySelector(config.kunDisplayWrapperSelector);
            
            this.kunyomiData = config.kunyomiData || [];
            this.onyomiData = config.onyomiData || [];

            if (
                !this.kunyomiButtonElement || 
                !this.onyomiButtonElement || 
                !this.onDisplayElement || 
                !this.kunDisplayElement || 
                !this.kunDisplayWrapperElement || 
                !this.onDisplayWrapperElement
            ) {
                return;
            }

            this.init();
        }

        init() {
            this.buildReadingsSpans(this.kunyomiData, this.kunDisplayElement, 'No Kunyomi');
            this.buildReadingsSpans(this.onyomiData, this.onDisplayElement, 'No Onyomi');

            const allReadingButtons = document.querySelectorAll('.reading-button');
            const vocabLedger = document.querySelector('#vocab-ledger');

            allReadingButtons.forEach(buttonElement => {
                buttonElement.addEventListener('click', (event) => {
                    event.stopPropagation();

                    const isCurrentlyActive = buttonElement.classList.contains('active');

                    allReadingButtons.forEach(otherButton => otherButton.classList.remove('active'));
                    if (this.kunDisplayWrapperElement) this.kunDisplayWrapperElement.classList.remove('active');
                    if (this.onDisplayWrapperElement) this.onDisplayWrapperElement.classList.remove('active');

                    if (isCurrentlyActive) {
                        vocabLedger.removeAttribute('data-active-filter');
                    } else {
                        buttonElement.classList.add('active');
                        const readingType = buttonElement.dataset.type;
                        vocabLedger.setAttribute('data-active-filter', readingType);

                        if (readingType === 'kun' && this.kunDisplayWrapperElement) {
                            this.kunDisplayWrapperElement.classList.add('active');
                        } else if (readingType === 'on' && this.onDisplayWrapperElement) {
                            this.onDisplayWrapperElement.classList.add('active');
                        }
                    }
                });
            });
        }

        buildReadingsSpans(readingsArray, displayElement, fallbackText) {
            displayElement.replaceChildren();

            if (readingsArray.length === 0) {
                const fallbackBadge = document.createElement('span');
                fallbackBadge.classList.add('readings-badge', 'fallback-badge');
                fallbackBadge.textContent = fallbackText;
                displayElement.append(fallbackBadge);
                return;
            }

            readingsArray.forEach(reading => {
                const badge = document.createElement('span');
                badge.classList.add('readings-badge');
                badge.textContent = reading;
                displayElement.append(badge);
            });
        }

        handleToggle(event, clickedButtonElement, otherButtonElement) {
            event.stopPropagation();

            const kanjiHouse = document.querySelector('.kanji-house');
            const isHotSwap = otherButtonElement.classList.contains('active');
            if (isHotSwap) {
                kanjiHouse.classList.add('is-switching');
            } else {
                kanjiHouse.classList.remove('is-switching');
            }

            const vocabLedger = document.querySelector('#vocab-ledger');

            if (clickedButtonElement === this.onyomiButtonElement) {
                if (clickedButtonElement.classList.contains('active')) {
                    clickedButtonElement.classList.remove('active');
                    this.onDisplayWrapperElement.classList.remove('active');
                    vocabLedger.removeAttribute('data-active-filter');
                } else {
                    clickedButtonElement.classList.add('active');
                    otherButtonElement.classList.remove('active');
                    this.onDisplayWrapperElement.classList.add('active');
                    this.kunDisplayWrapperElement.classList.remove('active');
                    
                    const targetKanjiReadingType = clickedButtonElement.dataset.type;
                    vocabLedger.setAttribute('data-active-filter', targetKanjiReadingType);
                }
            }

            if (clickedButtonElement === this.kunyomiButtonElement) {
                if (clickedButtonElement.classList.contains('active')) {
                    clickedButtonElement.classList.remove('active');
                    this.kunDisplayWrapperElement.classList.remove('active');
                    vocabLedger.removeAttribute('data-active-filter');
                } else {
                    clickedButtonElement.classList.add('active');
                    otherButtonElement.classList.remove('active');
                    this.kunDisplayWrapperElement.classList.add('active');
                    this.onDisplayWrapperElement.classList.remove('active');
                    
                    const targetKanjiReadingType = clickedButtonElement.dataset.type;
                    vocabLedger.setAttribute('data-active-filter', targetKanjiReadingType);
                }
            }
        }
    }

    class RadicalColorToggleController {
        constructor(config) {
            this.toggleButton = document.querySelector(config.buttonSelector);
            this.strokePathsRoot = document.querySelector(config.pathsSelector);
            this.container = document.querySelector('.card-container') || this.strokePathsRoot;
            this.storageKey = config.storageKey || "kanji-radical-highlight-active";

            if (!this.toggleButton || !this.strokePathsRoot) {
                return;
            }

            this.init();
        }

        init() {
            const isHighlightActive = localStorage.getItem(this.storageKey) === "true";

            const radicalGroup = this.strokePathsRoot.querySelector('[kvg\\:radical="general"]') || 
                                 this.strokePathsRoot.querySelector('[kvg\\:radical="tradit"]');
            const radicalCharacter = radicalGroup ? (radicalGroup.getAttribute("kvg:element") || "🏮") : "🏮";

            if (isHighlightActive) {
                this.toggleButton.classList.add("active");
                this.container.classList.add("highlight-radical");
                this.toggleButton.style.setProperty("--radical-content", `"${radicalCharacter}"`);
            } else {
                this.container.classList.remove("highlight-radical");
                this.toggleButton.style.setProperty("--radical-content", '"🏮"');
            }

            this.toggleButton.addEventListener("click", (clickEvent) => {
                clickEvent.stopPropagation();
                const wasActive = this.container.classList.contains("highlight-radical");
                const shouldBeActive = !wasActive;

                this.container.classList.toggle("highlight-radical", shouldBeActive);
                this.toggleButton.classList.toggle("active", shouldBeActive);

                if (shouldBeActive) {
                    this.toggleButton.style.setProperty("--radical-content", `"${radicalCharacter}"`);
                } else {
                    this.toggleButton.style.setProperty("--radical-content", '"🏮"');
                }

                localStorage.setItem(this.storageKey, shouldBeActive ? "true" : "false");
            });
        }
    }

    class StrokeNumbersToggleController {
        constructor(config) {
            this.toggleButton = document.querySelector(config.buttonSelector);
            this.strokeNumbersRoot = document.querySelector(config.numbersSelector);
            this.storageKey = config.storageKey || "kanji-stroke-numbers-active";

            if (!this.toggleButton || !this.strokeNumbersRoot) {
                return;
            }

            this.init();
        }

        init() {
            const isNumbersActive = localStorage.getItem(this.storageKey) === "true";

            const pathsRoot = document.querySelector("#stroke-paths-root");
            const totalStrokes = pathsRoot ? pathsRoot.querySelectorAll("path").length : 0;

            if (isNumbersActive) {
                this.toggleButton.classList.add("active");
                this.strokeNumbersRoot.classList.add("show-drawn-numbers");
                this.toggleButton.style.setProperty("--stroke-count-content", `"${totalStrokes}"`);
            } else {
                this.strokeNumbersRoot.classList.remove("show-drawn-numbers");
                this.toggleButton.style.setProperty("--stroke-count-content", '"🔢"');
            }

            this.toggleButton.addEventListener("click", (clickEvent) => {
                clickEvent.stopPropagation();
                const wasActive = this.strokeNumbersRoot.classList.contains("show-drawn-numbers");
                const shouldBeActive = !wasActive;

                this.strokeNumbersRoot.classList.toggle("show-drawn-numbers", shouldBeActive);
                this.toggleButton.classList.toggle("active", shouldBeActive);

                if (shouldBeActive) {
                    this.toggleButton.style.setProperty("--stroke-count-content", `"${totalStrokes}"`);
                } else {
                    this.toggleButton.style.setProperty("--stroke-count-content", '"🔢"');
                }

                localStorage.setItem(this.storageKey, shouldBeActive ? "true" : "false");
            });
        }
    }

    class DrawingPadController {
        constructor(config) {
            this.canvasElement = document.querySelector(config.canvasSelector);
            this.clearButtonElement = document.querySelector(config.clearButtonSelector);

            if (!this.canvasElement || !this.clearButtonElement) {
                return;
            }

            this.canvasContext = this.canvasElement.getContext('2d');
            this.isCurrentlyDrawing = false;

            this.initialize();
        }

        initialize() {
            this.configureCanvasResolution();
            window.addEventListener('resize', () => this.configureCanvasResolution());

            this.canvasElement.addEventListener('pointerdown', (pointerEvent) => this.startDrawingSequence(pointerEvent));
            this.canvasElement.addEventListener('pointermove', (pointerEvent) => this.drawStrokeSegment(pointerEvent));
            this.canvasElement.addEventListener('pointerup', () => this.terminateDrawingSequence());
            this.canvasElement.addEventListener('pointerleave', () => this.terminateDrawingSequence());

            this.clearButtonElement.addEventListener('click', (clickEvent) => {
                clickEvent.stopPropagation();
                this.clearCanvas();
            });
        }

        configureCanvasResolution() {
            const boundingRectangle = this.canvasElement.getBoundingClientRect();
            this.canvasElement.width = boundingRectangle.width * window.devicePixelRatio;
            this.canvasElement.height = boundingRectangle.height * window.devicePixelRatio;
            this.canvasContext.scale(window.devicePixelRatio, window.devicePixelRatio);
            this.clearCanvas();
        }

        getPointerCoordinates(pointerEvent) {
            const boundingRectangle = this.canvasElement.getBoundingClientRect();
            return {
                coordinateX: pointerEvent.clientX - boundingRectangle.left,
                coordinateY: pointerEvent.clientY - boundingRectangle.top
            };
        }

        startDrawingSequence(pointerEvent) {
            pointerEvent.stopPropagation();
            this.isCurrentlyDrawing = true;
            const pointerCoordinates = this.getPointerCoordinates(pointerEvent);
            this.canvasContext.beginPath();
            this.canvasContext.moveTo(pointerCoordinates.coordinateX, pointerCoordinates.coordinateY);
        }

        drawStrokeSegment(pointerEvent) {
            if (!this.isCurrentlyDrawing) {
                return;
            }
            pointerEvent.stopPropagation();

            const pointerCoordinates = this.getPointerCoordinates(pointerEvent);
            const rootStyleContext = getComputedStyle(document.documentElement);
            const activeInkColor = rootStyleContext.getPropertyValue('--ink-color').trim() || '#2d3436';

            this.canvasContext.lineWidth = 3;
            this.canvasContext.lineCap = 'round';
            this.canvasContext.lineJoin = 'round';
            this.canvasContext.strokeStyle = activeInkColor;

            this.canvasContext.lineTo(pointerCoordinates.coordinateX, pointerCoordinates.coordinateY);
            this.canvasContext.stroke();
        }

        terminateDrawingSequence() {
            this.isCurrentlyDrawing = false;
        }

        clearCanvas() {
            this.canvasContext.clearRect(0, 0, this.canvasElement.width, this.canvasElement.height);
        }
    }

    class KanjiMeaningController {
        constructor(config) {
            this.meaningElement = document.querySelector(config.meaningSelector);
            this.meanings = config.meanings || [];
            this.kanji = config.kanji || '';
            
            if (!this.meaningElement || this.meanings.length === 0) {
                return;
            }

            this.customMeaningKey = `kanji-custom-meaning-${this.kanji}`;
            this.workspaceElement = document.querySelector('.deck-workspace');

            this.init();
        }

        init() {
            this.workingMeanings = [...this.meanings];

            const savedCustomMeaning = localStorage.getItem(this.customMeaningKey);
            if (savedCustomMeaning) {
                const customIndex = this.workingMeanings.indexOf(savedCustomMeaning);
                if (customIndex > 0) {
                    this.workingMeanings.splice(customIndex, 1);
                    this.workingMeanings.unshift(savedCustomMeaning);
                }
            }

            this.meaningElement.replaceChildren();

            const primaryPill = document.createElement('span');
            primaryPill.classList.add('meaning-pill', 'primary-pill');
            primaryPill.textContent = this.workingMeanings[0];
            this.meaningElement.appendChild(primaryPill);

            if (this.workingMeanings.length > 1) {
                let drawerBackdrop = document.querySelector('.meanings-drawer-backdrop');
                if (!drawerBackdrop && this.workspaceElement) {
                    drawerBackdrop = document.createElement('div');
                    drawerBackdrop.classList.add('meanings-drawer-backdrop', 'is-hidden');

                    const drawerSheet = document.createElement('div');
                    drawerSheet.classList.add('meanings-drawer-sheet');

                    const drawerTitle = document.createElement('div');
                    drawerTitle.classList.add('meanings-drawer-title');
                    drawerTitle.textContent = 'Alternative Meanings';

                    const drawerPillsContainer = document.createElement('div');
                    drawerPillsContainer.classList.add('meanings-drawer-pills');

                    drawerSheet.appendChild(drawerTitle);
                    drawerSheet.appendChild(drawerPillsContainer);
                    drawerBackdrop.appendChild(drawerSheet);
                    this.workspaceElement.appendChild(drawerBackdrop);

                    drawerBackdrop.addEventListener('click', (clickEvent) => {
                        if (clickEvent.target === drawerBackdrop) {
                            drawerBackdrop.classList.add('is-hidden');
                        }
                    });
                }

                const drawerPillsContainer = drawerBackdrop ? drawerBackdrop.querySelector('.meanings-drawer-pills') : null;
                if (drawerPillsContainer) {
                    drawerPillsContainer.replaceChildren();

                    this.workingMeanings.slice(1).forEach(meaning => {
                        const secondaryPill = document.createElement('span');
                        secondaryPill.classList.add('meaning-pill', 'secondary-pill');
                        secondaryPill.textContent = meaning;

                        secondaryPill.addEventListener('click', (clickEvent) => {
                            clickEvent.stopPropagation();
                            localStorage.setItem(this.customMeaningKey, meaning);
                            drawerBackdrop.classList.add('is-hidden');
                            this.init();
                        });

                        drawerPillsContainer.appendChild(secondaryPill);
                    });
                }

                const meaningExpandButton = document.createElement('button');
                meaningExpandButton.classList.add('meaning-expand-button');
                meaningExpandButton.textContent = (this.workingMeanings.length - 1) + '+';

                meaningExpandButton.addEventListener('click', (clickEvent) => {
                    clickEvent.stopPropagation();
                    if (drawerBackdrop) {
                        drawerBackdrop.classList.remove('is-hidden');
                    }
                });

                this.meaningElement.appendChild(meaningExpandButton);
            }
        }
    }

    class GlobalSettingsManager {
        storageKey = "kanji-wizard-global-settings";

        defaultSettings = {
            vocabulary: {
                maximumWordCount: 4
            }
        };

        constructor() {
            this.settings = this.loadSettings();
        }

        loadSettings() {
            const storedSettingsString = localStorage.getItem(this.storageKey);
            if (!storedSettingsString) {
                return JSON.parse(JSON.stringify(this.defaultSettings));
            }

            try {
                const parsedSettings = JSON.parse(storedSettingsString);
                return {
                    vocabulary: {
                        ...this.defaultSettings.vocabulary,
                        ...(parsedSettings.vocabulary || {})
                    }
                };
            } catch (parsingError) {
                return JSON.parse(JSON.stringify(this.defaultSettings));
            }
        }

        saveSettings() {
            localStorage.setItem(this.storageKey, JSON.stringify(this.settings));
        }

        getVocabularySettings() {
            return this.settings.vocabulary;
        }

        updateVocabularySettings(newVocabularySettings) {
            this.settings.vocabulary = {
                ...this.settings.vocabulary,
                ...newVocabularySettings
            };
            this.saveSettings();
        }
    }

    class VocabLedgerService {
        constructor(config) {
            this.ledgerContainer = document.querySelector(config.ledgerContainerElement);
            this.rawVocabData = config.vocabData || [];
            this.settingsManager = config.settingsManager;

            if (!this.ledgerContainer) {
                return;
            }

            this.render();
        }

        getProcessedVocabData() {
            const vocabularySettings = this.settingsManager.getVocabularySettings();
            const uniqueVocabEntries = this.getUniqueVocabEntries();
            const limit = vocabularySettings.maximumWordCount ?? uniqueVocabEntries.length;
            return uniqueVocabEntries.slice(0, limit);
        }

        render() {
            this.ledgerContainer.replaceChildren();
            const vocabDataToDisplay = this.getProcessedVocabData();

            vocabDataToDisplay.forEach(vocab => {
                const vocabEntryElement = document.createElement('div');
                vocabEntryElement.classList.add('vocab-entry');

                const level = vocab.jlptLevel ? `n${vocab.jlptLevel}` : 'na';

                const targetKanjiReadingTypes = Array.isArray(vocab.targetKanjiReadingType) ? vocab.targetKanjiReadingType.join(' ') : 'neither';
                vocabEntryElement.dataset.targetKanjiReadingType = targetKanjiReadingTypes;

                const badgeContainerElement = document.createElement('div');
                badgeContainerElement.classList.add('badge-container');

                const svgNS = 'http://www.w3.org/2000/svg';
                const hatSvg = document.createElementNS(svgNS, 'svg');
                hatSvg.classList.add('hat-vector');

        getUniqueVocabEntries() {
            const seenWrittenForms = new Set();
            const uniqueEntries = [];

            for (const vocabEntry of this.rawVocabData) {
                const writtenForm = vocabEntry.writtenForm;
                if (!seenWrittenForms.has(writtenForm)) {
                    seenWrittenForms.add(writtenForm);
                    uniqueEntries.push(vocabEntry);
                }
            }

            return uniqueEntries;
        }
    }

    class SettingsDrawerController {
        constructor(config) {
            this.openButton = document.querySelector(config.openButtonSelector);
            this.closeButton = document.querySelector(config.closeButtonSelector);
            this.backdropElement = document.querySelector(config.backdropSelector);
            this.settingsManager = config.settingsManager;
            this.vocabLedgerService = config.vocabLedgerService;

            this.sortSelectElement = document.querySelector(config.sortSelectSelector);
            this.maxCountInput = document.querySelector(config.maxCountInputSelector);
            this.maxCountDisplay = document.querySelector(config.maxCountDisplaySelector);
            this.totalAvailableDisplay = document.querySelector(config.totalAvailableDisplaySelector);

            if (!this.openButton || !this.backdropElement || !this.settingsManager) {
                return;
            }

            this.init();
        }

        init() {
            this.openButton.addEventListener('click', (event) => {
                event.stopPropagation();
                this.syncControlsFromSettings();
                this.backdropElement.classList.remove('is-hidden');
            });

            if (this.closeButton) {
                this.closeButton.addEventListener('click', (event) => {
                    event.stopPropagation();
                    this.backdropElement.classList.add('is-hidden');
                });
            }

            this.backdropElement.addEventListener('click', (event) => {
                if (event.target === this.backdropElement) {
                    this.backdropElement.classList.add('is-hidden');
                }
            });

            if (this.sortSelectElement) {
                this.sortSelectElement.addEventListener('change', (event) => {
                    this.settingsManager.updateVocabularySettings({
                        sortCriterion: event.target.value
                    });
                    if (this.vocabLedgerService) {
                        this.vocabLedgerService.render();
                    }
                });
            }

            if (this.maxCountInput) {
                this.maxCountInput.addEventListener('input', (event) => {
                    const newCount = parseInt(event.target.value, 10) || 10;
                    if (this.maxCountDisplay) {
                        this.maxCountDisplay.textContent = newCount;
                    }
                    this.settingsManager.updateVocabularySettings({
                        maximumWordCount: newCount
                    });
                    if (this.vocabLedgerService) {
                        this.vocabLedgerService.render();
                    }
                });
            }
        }

        syncControlsFromSettings() {
            const vocabularySettings = this.settingsManager.getVocabularySettings();
            const savedCount = vocabularySettings.maximumWordCount || 10;

            if (this.maxCountInput) {
                this.maxCountInput.max = 20;
                this.maxCountInput.value = savedCount;
            }

            if (this.maxCountDisplay) {
                this.maxCountDisplay.textContent = savedCount;
            }

            if (this.totalAvailableDisplay && this.vocabLedgerService) {
                const totalAvailableWords = this.vocabLedgerService.getUniqueVocabEntries().length;
                this.totalAvailableDisplay.textContent = `(${totalAvailableWords} available)`;
            }
        }
    }

    class LinkInstallationService {
        targetLinkElement = null;

        constructor(config) {
            this.targetLinkElement = document.querySelector(config.linkSelector);

            if (!this.targetLinkElement) {
                return;
            }

            this.installDynamicUrl(config.baseUrl, config.params, config.openInNewTab);
        }

        installDynamicUrl(baseUrlString, parametersObject = {}, openInNewTabFlag = true) {
            const urlParametersBuilder = new URLSearchParams();

            for (const [parameterKey, parameterValue] of Object.entries(parametersObject)) {
                const resolvedValue = (parameterValue !== null && parameterValue !== undefined)
                    ? String(parameterValue).trim()
                    : 'Unknown';

                urlParametersBuilder.append(parameterKey, resolvedValue);
            }

            const hasParametersFlag = Object.keys(parametersObject).length > 0;
            const finalizedUrlString = hasParametersFlag
                ? `${baseUrlString}?${urlParametersBuilder.toString()}`
                : baseUrlString;
                
            this.targetLinkElement.href = finalizedUrlString;

            if (openInNewTabFlag) {
                this.targetLinkElement.target = '_blank';
            }
        }
    }




    class KanjiSvgDOMBuilder {
        static SVG_NAMESPACE = 'http://www.w3.org/2000/svg';

        static buildElement(jsonNode, tagName) {
            const svgElement = document.createElementNS(this.SVG_NAMESPACE, tagName);

            for (const [key, value] of Object.entries(jsonNode)) {
                if (key === 'g' || key === 'path' || key === 'text') {
                    const childNodesArray = Array.isArray(value) ? value : [value];

                    childNodesArray.forEach(childNode => {
                        const childElement = this.buildElement(childNode, key);
                        svgElement.appendChild(childElement);
                    });
                }

                else if (key === '#text') {
                    const textNode = document.createTextNode(value);
                    svgElement.appendChild(textNode);
                    }
                else if (typeof value === 'string' || typeof value === 'number') {
                    svgElement.setAttribute(key, value);
                }
            }

            if (tagName === 'path') {
                this.setupPathAnimation(svgElement);
            }

            return svgElement;
        }

        static setupPathAnimation (pathElement) {
            pathElement.classList.add('kanji-stroke');
            const strokeLength = pathElement.getTotalLength();
            pathElement.dataset.strokeLength = strokeLength;
            pathElement.style.strokeDasharray = strokeLength;
            pathElement.style.strokeDashoffset = 0;
        }
    }
    
    class StrokeStateController {
        constructor(totalStrokeCount) {
            this.totalStrokeCount = totalStrokeCount;
            this.currentStrokeIndex = totalStrokeCount; 
        }

        increment() {
            if (this.currentStrokeIndex >= this.totalStrokeCount) {
                this.currentStrokeIndex = 0;
            } else {
                this.currentStrokeIndex++;
            }
        }

        setToMax() {
            this.currentStrokeIndex = this.totalStrokeCount;
        }

        setToZero() {
            this.currentStrokeIndex = 0;
        }

        getCurrent() {
            return this.currentStrokeIndex;
        }
    }

    class KanjiSvgController {
        constructor(config) {
            this.strokePathsRoot = document.querySelector(config.pathsSelector);
            this.strokeNumbersRoot = document.querySelector(config.numbersSelector);
            this.svgData = config.svgData;

            this.#initializeCanvas();

            this.cachedPathElements = Array.from(this.strokePathsRoot.querySelectorAll('path'));
            this.cachedPathElements.sort((pathElementA, pathElementB) => {
                const indexA = parseInt(pathElementA.id.split('-s')[1]) || 0;
                const indexB = parseInt(pathElementB.id.split('-s')[1]) || 0;
                return indexA - indexB;
            });

            this.cachedTextElements = Array.from(this.strokeNumbersRoot.querySelectorAll('text'));
            this.cachedTextElements.sort((textElementA, textElementB) => {
                const numberA = parseInt(textElementA.textContent) || 0;
                const numberB = parseInt(textElementB.textContent) || 0;
                return numberA - numberB;
            });

            this.cachedPathElements.forEach((pathElement, elementIndex) => {
                pathElement.style.setProperty('--stroke-index', elementIndex + 1);
            });
            this.strokePathsRoot.style.setProperty('--total-strokes', this.cachedPathElements.length);

            this.cachedTextElements.forEach((textElement, elementIndex) => {
                textElement.style.setProperty('--stroke-index', elementIndex + 1);
            });

            this.updateCurrentStrokeCount(this.cachedPathElements.length);
        }

        updateCurrentStrokeCount(count) {
            this.cachedTextElements.forEach((textElement, elementIndex) => {
                const isDrawn = (elementIndex + 1) <= count;
                textElement.classList.toggle('is-drawn', isDrawn);
            });
        }

        #initializeCanvas() {
            if (!this.strokePathsRoot || !this.svgData) {
                console.warn('KanjiSvgController: Required DOM elements or SVG data is missing.');
                return;
            }

            this.strokePathsRoot.replaceChildren();
            if (this.strokeNumbersRoot) {
                this.strokeNumbersRoot.replaceChildren();
            }

            let pathsGroupNode = this.svgData.g[0];
            if (!pathsGroupNode || !pathsGroupNode.id || !pathsGroupNode.id.startsWith("kvg:StrokePaths_")) {
                const traverseToFindPaths = (node) => {
                    if (node && node.id && node.id.startsWith("kvg:StrokePaths_")) {
                        return node;
                    }
                    if (node && node.g) {
                        const groups = Array.isArray(node.g) ? node.g : [node.g];
                        for (const group of groups) {
                            const found = traverseToFindPaths(group);
                            if (found) return found;
                        }
                    }
                    return null;
                };
                const foundPaths = traverseToFindPaths(this.svgData);
                if (foundPaths) {
                    pathsGroupNode = foundPaths;
                }
            }

            if (pathsGroupNode) {
                const domPathsGroup = KanjiSvgDOMBuilder.buildElement(pathsGroupNode, 'g');
                this.strokePathsRoot.appendChild(domPathsGroup);
            }

            let numbersGroupNode = this.svgData.g[1];
            if (!numbersGroupNode || !numbersGroupNode.id || !numbersGroupNode.id.startsWith("kvg:StrokeNumbers_")) {
                const traverseToFindNumbers = (node) => {
                    if (node && node.id && node.id.startsWith("kvg:StrokeNumbers_")) {
                        return node;
                    }
                    if (node && node.g) {
                        const groups = Array.isArray(node.g) ? node.g : [node.g];
                        for (const group of groups) {
                            const found = traverseToFindNumbers(group);
                            if (found) return found;
                        }
                    }
                    return null;
                };
                const foundNumbers = traverseToFindNumbers(this.svgData);
                if (foundNumbers) {
                    numbersGroupNode = foundNumbers;
                }
            }

            if (this.strokeNumbersRoot && numbersGroupNode) {
                const domNumbersGroup = KanjiSvgDOMBuilder.buildElement(numbersGroupNode, 'g');
                this.strokeNumbersRoot.appendChild(domNumbersGroup);
            }
        }

        drawNextStroke(strokeCount) {
            const targetPathElement = this.cachedPathElements[strokeCount - 1];

            if (targetPathElement) {
                targetPathElement.style.strokeDashoffset = 0;
            }
        }

        resetAllStrokes() {
            this.cachedPathElements.forEach(pathElement => {
                const originalLength = pathElement.dataset.strokeLength;
                if (originalLength) {
                    pathElement.style.strokeDashoffset = originalLength;
                }
            });
        }
    }




    class SigilController {
        sigil = null;
        isDragging = null;
        constructor(sigilElement, sigilType, dockElement, clickCallback) {
            this.sigil = document.querySelector(sigilElement);
            this.dock = document.querySelector(dockElement || '#sigil-dock');
            this.sigilType = sigilType;
            this.clickCallback = clickCallback || null;
            this.isDragging = false;

            this.startXCoordinate = 0;
            this.startYCoordinate = 0;
            this.hasMoved = false;

            this.currentIndex = 0;
            this.init();
        }

        getActiveVocabEntry() {
            return document.querySelector('.vocab-entry.active-reveal');
        }


        revealNextVocabSegment() {
            const entries = document.querySelectorAll('.vocab-entry');
            if (this.currentIndex >= entries.length) {
                entries[this.currentIndex - 1].classList.remove('active-reveal');
                return;
            }

            if (this.currentIndex > 0) {
                entries[this.currentIndex - 1].classList.remove('active-reveal');
            }
            
            const currentEntry = entries[this.currentIndex];

            const allFurigana = currentEntry.querySelectorAll('.furigana');

            const hiddenFurigana = Array.from(allFurigana).find(furigana => furigana.classList.contains('is-hidden'));

            if (hiddenFurigana) {
                hiddenFurigana.classList.remove('is-hidden');
                currentEntry.classList.add('active-reveal');
            } else {
                const english = currentEntry.querySelector('.vocab-english');
                if (english && english.classList.contains('is-hidden')) {
                    english.classList.remove('is-hidden');
                    this.currentIndex++;
                }
            }
        }

        dockSigil() {
            const workspace = document.querySelector('.deck-workspace');
            const dockRect = this.dock.getBoundingClientRect();
            const workspaceRect = workspace.getBoundingClientRect();
            const targetX = dockRect.left - workspaceRect.left + (dockRect.width / 2) - (this.sigil.offsetWidth / 2);
            const targetY = dockRect.top - workspaceRect.top + (dockRect.height / 2) - (this.sigil.offsetHeight / 2);

            this.sigil.style.left = `${targetX}px`;
            this.sigil.style.top = `${targetY}px`;

            setTimeout(() => {
                this.sigil.classList.add('hidden-in-dock');
            }, 10);

            localStorage.setItem(`${this.sigilType}-sigil-docked`, 'true');
        }

        undockSigil() {
            const workspace = document.querySelector('.deck-workspace');
            const dock = this.dock;
            const dockRect = dock.getBoundingClientRect();
            const workspaceRect = workspace.getBoundingClientRect();

            this.sigil.classList.add('is-animating'); 
            workspace.appendChild(this.sigil);

            const startX = dockRect.left - workspaceRect.left;
            const startY = dockRect.top - workspaceRect.top;
            
            this.sigil.style.left = `${startX}px`;
            this.sigil.style.top = `${startY}px`;

            this.sigil.offsetHeight; 

            this.sigil.classList.remove('hidden-in-dock');
            this.sigil.style.top = `${startY - 80}px`; 

            localStorage.setItem(`${this.sigilType}-sigil-docked`, 'false');

            setTimeout(() => this.sigil.classList.remove('is-animating'), 400);
        }

        loadPosition() {
            const xCoordinate = localStorage.getItem(`${this.sigilType}-sigil-x-coordinate`);
            const yCoordinate = localStorage.getItem(`${this.sigilType}-sigil-y-coordinate`);
            if (xCoordinate && yCoordinate) {
                this.sigil.style.left = xCoordinate;
                this.sigil.style.top = yCoordinate;
                this.sigil.style.bottom = 'auto';
                this.sigil.style.right = 'auto';
            }
        }

        setupListeners() {
            const workspace = document.querySelector('.deck-workspace');

            if (workspace && typeof ResizeObserver !== 'undefined') {
                this.resizeObserver = new ResizeObserver(() => {
                    this.checkBoundaryAndDockIfNeeded();
                });
                this.resizeObserver.observe(workspace);
            }

            this.dock.addEventListener('click', (event) => {
                event.stopPropagation();
                
                if (this.sigil.classList.contains('hidden-in-dock')) {
                    this.undockSigil();
                } else {
                    this.dockSigil();
                }
            });

            this.sigil.addEventListener('pointerdown', (event) => {
                this.sigil.classList.remove('is-animating');
                this.isDragging = true;
                this.hasMoved = false;
                this.startXCoordinate = event.clientX;
                this.startYCoordinate = event.clientY;

                const sigilRectangle = this.sigil.getBoundingClientRect();
                const workspaceRectangle = workspace.getBoundingClientRect();

                this.grabOffsetX = event.clientX - sigilRectangle.left;
                this.grabOffsetY = event.clientY - sigilRectangle.top;

                this.sigil.setPointerCapture(event.pointerId);

                const onPointerMove = (moveEvent) => {
                    if (!this.isDragging) return;

                    if (Math.abs(moveEvent.clientX - this.startXCoordinate) > 5 || Math.abs(moveEvent.clientY - this.startYCoordinate) > 5) {
                        this.hasMoved = true;
                    }

                    requestAnimationFrame(() => {
                        const currentWorkspaceRectangle = workspace.getBoundingClientRect();

                        let newX = moveEvent.clientX - currentWorkspaceRectangle.left - this.grabOffsetX;
                        let newY = moveEvent.clientY - currentWorkspaceRectangle.top - this.grabOffsetY;

                        const maximumX = currentWorkspaceRectangle.width - this.sigil.offsetWidth;
                        const maximumY = currentWorkspaceRectangle.height - this.sigil.offsetHeight;

                        this.sigil.style.left = Math.max(0, Math.min(newX, maximumX)) + 'px';
                        this.sigil.style.top = Math.max(0, Math.min(newY, maximumY)) + 'px';
                    });
                };

                const onPointerUp = () => {
                    const dock = document.querySelector('#sigil-dock');
                    const sigilRect = this.sigil.getBoundingClientRect();
                    const dockRect = this.dock.getBoundingClientRect();

                    const isOverDock = !(sigilRect.right < dockRect.left || 
                    sigilRect.left > dockRect.right || 
                    sigilRect.bottom < dockRect.top || 
                    sigilRect.top > dockRect.bottom);

                    if (this.isDragging) {
                        this.isDragging = false;
                        this.sigil.classList.add('is-animating')
                        if (isOverDock) {
                            this.dockSigil();
                        } else {
                            localStorage.setItem(`${this.sigilType}-sigil-x-coordinate`, this.sigil.style.left);
                            localStorage.setItem(`${this.sigilType}-sigil-y-coordinate`, this.sigil.style.top);
                        }
                    }
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);
                };

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            });

            this.sigil.addEventListener('click', (event) => {
                if (this.hasMoved) return;

                if (typeof this.clickCallback === 'function') {
                    this.clickCallback();
                } else if (this.sigilType === 'vocab') {
                    this.revealNextVocabSegment();
                }
            });
        }

        restoreState() {
            const isUndocked = localStorage.getItem(`${this.sigilType}-sigil-docked`) === 'false';

            if (isUndocked) {
                this.loadPosition();
                this.checkBoundaryAndDockIfNeeded();
            } else {
                this.dockSigil();
            }
        }

        checkBoundaryAndDockIfNeeded() {
            if (this.sigil.classList.contains('hidden-in-dock')) {
                return;
            }

            const workspace = document.querySelector('.deck-workspace');
            if (!workspace) return;

            const sigilRectangle = this.sigil.getBoundingClientRect();
            const workspaceRectangle = workspace.getBoundingClientRect();

            const isOutOfBounds = (
                sigilRectangle.left < workspaceRectangle.left ||
                sigilRectangle.right > workspaceRectangle.right ||
                sigilRectangle.top < workspaceRectangle.top ||
                sigilRectangle.bottom > workspaceRectangle.bottom
            );

            if (isOutOfBounds) {
                this.dockSigil();
            }
        }

        init() {
            this.sigil.classList.add('is-animating');
            this.restoreState();
            this.setupListeners();
        }
    }

    class DataLoader {
        constructor(elementId = 'json-container') {
            this.elementId = elementId;
            this.data = this.#init();
        }

        #init() {
            const element = document.getElementById(this.elementId);
            
            if (!element || !element.textContent.trim()) {
                console.error(`DataLoader Error: #${this.elementId} not found or empty.`);
                return null;
            }

            try {
                return JSON.parse(element.textContent);
            } catch (parsingError) {
                console.error("DataLoader Error: Failed to parse JSON data.", parsingError);
                return null;
            }
        }

        isValid() {
            return this.data !== null;
        }
    }
   
    class KanjiDataProvider {
        constructor(rawData) {
            this.data = rawData || {};
        }

        getKanji() {
            return this.data.kanji || '';
        }

        getJlptLevel() {
            return this.data.jlpt || null;
        }

        getMeanings() {
            return this.data.meanings || [];
        }

        getOnReadings() {
            return this.data.on_readings || [];
        }

        getKunReadings() {
            return this.data.kun_readings || [];
        }

        getSvgData() {
            return this.data.svg || null;
        }

        getAssociatedWords() {
            return this.data.associatedWords || [];
        }
    }

    class BackCardApp {
        strokeStateController = null;
        kanjiSvgController = null;
        kanjiTappableArea = null;

        constructor() {
            const loader = new DataLoader();
            if (!loader.isValid()) {
                return;
            }
            
            this.dataProvider = new KanjiDataProvider(loader.data);

            this.kanjiSvgController = new KanjiSvgController({
                pathsSelector: '#stroke-paths-root',
                numbersSelector: '#stroke-numbers-root',
                svgData: this.dataProvider.getSvgData()
            });

            this.strokeStateController = new StrokeStateController(
                this.kanjiSvgController.cachedPathElements.length
            );

            this.kanjiTappableArea = document.querySelector('.kanji-house');

            this.init();
        }

        init() {
            this.settingsManager = new GlobalSettingsManager();

            new SigilController('#vocab-sigil', 'vocab', '#sigil-dock');

            new SigilController('#stroke-sigil', 'stroke', '#stroke-sigil-dock', () => {
                this.advanceKanjiStroke();
            });

            this.vocabLedgerService = new VocabLedgerService({
                vocabData: this.dataProvider.getAssociatedWords(),
                ledgerContainerElement: '#vocab-ledger',
                settingsManager: this.settingsManager
            });

            new SettingsDrawerController({
                openButtonSelector: '#open-settings-button',
                closeButtonSelector: '#close-settings-button',
                backdropSelector: '#settings-drawer-backdrop',
                maxCountInputSelector: '#settings-vocab-max-count',
                maxCountDisplaySelector: '#settings-vocab-max-count-value',
                totalAvailableDisplaySelector: '#settings-vocab-total-available-value',
                settingsManager: this.settingsManager,
                vocabLedgerService: this.vocabLedgerService
            });

            new KanjiMeaningController({
                meaningSelector: '#kanji-meaning',
                meanings: this.dataProvider.getMeanings(),
                kanji: this.dataProvider.getKanji()
            });

            new ReadingDisplayController({
                kunyomiButtonSelector: '#kunyomi-button',
                onyomiButtonSelector: '#onyomi-button',
                onDisplaySelector: '#readings-display-on',
                kunDisplaySelector: '#readings-display-kun',
                onDisplayWrapperSelector: '#readings-display-wrapper-on',
                kunDisplayWrapperSelector: '#readings-display-wrapper-kun',
                kunyomiData: this.dataProvider.getKunReadings(),
                onyomiData: this.dataProvider.getOnReadings()
            });

            new LinkInstallationService({
                linkSelector: '#report-issue-link',
                baseUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSeji75MTbdugBk8IiQYl4_JQyIoiYMMwil0bMiCjl1r1pjZUg/viewform',
                openInNewTab: true,
                params: {
                    'usp': 'pp_url',
                    'entry.196764883': this.dataProvider.getKanji(),      
                    'entry.870807372': this.dataProvider.getJlptLevel()  
                }
            });

            new RadicalColorToggleController({
                buttonSelector: '#toggle-radical-button',
                pathsSelector: '#stroke-paths-root',
                storageKey: 'kanji-radical-highlight-active'
            });

            new StrokeNumbersToggleController({
                buttonSelector: '#toggle-stroke-numbers-button',
                numbersSelector: '#stroke-numbers-root',
                storageKey: 'kanji-stroke-numbers-active'
            });

            new DrawingPadController({
                canvasSelector: '#drawing-canvas',
                clearButtonSelector: '#clear-drawing-button'
            });

            this.setupThemeToggle();
            this.setupListeners();
        }

        setupListeners() {
            if (!this.kanjiTappableArea) {
                return;
            }
            
            this.kanjiTappableArea.addEventListener('click', (event) => this.handleKanjiTap(event));
        }

        advanceKanjiStroke() {
            this.strokeStateController.increment();
            const currentCount = this.strokeStateController.getCurrent();

            if (currentCount === 0) {
                this.kanjiSvgController.resetAllStrokes();
                this.kanjiSvgController.updateCurrentStrokeCount(0);
            } else {
                this.kanjiSvgController.drawNextStroke(currentCount);
                this.kanjiSvgController.updateCurrentStrokeCount(currentCount);
            }
        }

        handleKanjiTap(event) {
            if (event && event.target && event.target.closest && event.target.closest('.readings-display-wrapper')) {
                return;
            }
            this.advanceKanjiStroke();
        }

        

        setupThemeToggle() {
            this.themeButton = document.querySelector('#toggle-theme-button');
            if (!this.themeButton) return;

            const root = document.documentElement;

            const updateState = (isDark) => {
                root.classList.toggle('user-night-mode', isDark);
                root.classList.toggle('user-day-mode', !isDark);
                
                this.themeButton.setAttribute('data-theme', isDark ? 'dark' : 'light');
                localStorage.setItem('kanji-wizard-theme', isDark ? 'dark' : 'light');
            };

            const locallySavedTheme = localStorage.getItem('kanji-wizard-theme');
            const userSystemSetAsDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            updateState(locallySavedTheme ? locallySavedTheme === 'dark' : userSystemSetAsDark);

            this.themeButton.addEventListener('click', (event) => {
                event.stopPropagation();
                const switchedToDarkMode = root.classList.contains('user-day-mode');
                updateState(switchedToDarkMode);
            });
        }
    }
    
    new BackCardApp();
    
})();
</script>
